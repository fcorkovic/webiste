<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bistro Steffi | Restoran s tjednom ponudom</title>
    <meta name="description" content="Bistro Steffi - vrhunska domaća kuhinja, svečani ambijent i tjedna ponuda.">
    <link rel="stylesheet" href="style.css">    
    <link rel="icon" href="slike/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo">
            <a href="">
                <img src="slike/logo2.png" alt="Bistro Steffi logo">
            </a>
        </div>
        <div class="hamburger" id="hamburger">
            <i class="fas fa-bars"></i>
        </div>

        <nav id="nav-menu">
            <a href="" class="active">Početna</a>
            <a href="onama/">O nama</a>
            <a href="galerija/">Galerija</a>
            <a href="kontakt/">Kontakt</a>
        </nav>
    </div>
</header>

<main>
    <section class="page-hero" style="background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('slike/2B2A2880.jpg') center/cover no-repeat;">
        <div class="hero-content">
            <h1>Bistro <span class="zlatni">Steffi</span></h1>
            <p>Restoran s tjednom ponudom</p>
        </div>
    </section>

    <section class="tjedna-ponuda-section">
        <div class="container">
            <h2 class="section-naslov">Tjedna <span class="zlatni">ponuda</span></h2>
            
            <div class="ponuda-slika-container">
                <img src="slike/jelovnik27.4.jpg" alt="Jelovnik tjedne ponude Bistro Steffi" class="ponuda-slika">
            </div>
        </div>
    </section>

<section class="social-section">
    <div class="container">
        <h3>Pratite nas na društvenim mrežama</h3>
        <div class="social-icons">
            <a href="https://www.facebook.com/p/Bistro-Steffi-100063464525856/?locale=hr_HR" target="_blank" class="social-icon">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com/bistro_steffi/" target="_blank" class="social-icon">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </div>
</section>
</main>

<footer>
    <div class="container">
        <p>&copy; 2026 Bistro Steffi | Sva prava pridržana</p>
    </div>
</footer>

<!-- JS -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const hamburger = document.getElementById("hamburger");
    const nav = document.getElementById("nav-menu");

    hamburger.addEventListener("click", () => {
        nav.classList.toggle("active");
    });
});
</script>

</body>
</html>
